version: '3.8'

services:
  pokrabs:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=./data/pokrabs.db
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

