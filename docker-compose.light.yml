# POKRABS Light Operation Mode Configuration
#
# Light operation mode uses SQLite with a persistent volume mount.
# Data persists across container restarts, making it suitable for
# small-scale deployments or personal use where you want data to survive
# container updates.
#
# The database is NOT automatically seeded - you'll start with an empty database.

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    volumes:
      # Persistent SQLite database storage
      - ./data:/app/data
    environment:
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=./data/pokrabs.db
      - NODE_ENV=production
      - PORT=3001
      # DEMO_MODE is not set, so no seeding occurs
    restart: unless-stopped

